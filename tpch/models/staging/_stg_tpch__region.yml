version: 2

models:
  - name: stg_tpch__region
    description: "Regiões geográficas (5 linhas). Topo da hierarquia region -> nation."
    columns:
      - name: id
        description: "Chave primária da região."
        data_tests:
          - unique
          - not_null
      - name: name
        description: "Nome da região (AFRICA, AMERICA, ASIA, EUROPE, MIDDLE EAST)."
        data_tests:
          - accepted_values:
              arguments:
                values: ["AFRICA", "AMERICA", "ASIA", "EUROPE", "MIDDLE EAST"]
          - not_null
      - name: comment
        description: "Texto livre gerado pelo TPC-H, sem valor analítico."
