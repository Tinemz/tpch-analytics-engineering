version: 2

models:
  - name: stg_tpch__supplier
    description: "Fornecedores, um por linha."
    columns:
      - name: supplier_id
        description: '{{ doc("tpch_supplier_id") }}'
        data_tests:
          - unique
          - not_null
      - name: name
        description: "Nome do fornecedor, no formato Supplier#000000001."
      - name: address
        description: '{{ doc("tpch_address") }}'
      - name: nation_id
        description: '{{ doc("tpch_nation_id") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__nation')
                field: nation_id
      - name: phone
        description: '{{ doc("tpch_phone") }}'
      - name: account_balance
        description: '{{ doc("tpch_account_balance") }}'
      - name: comment
        description: '{{ doc("tpch_comment") }}'
