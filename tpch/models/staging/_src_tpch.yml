version: 2

sources:
  - name: tpch
    # database omitido de propósito: herda o project do profiles.yml (target)
    schema: tpch_raw               # dataset com as 8 tabelas cruas
    tables:
      - name: customer
      - name: lineitem
      - name: orders
        config:
          freshness:
            warn_after: 
              count: 11677 #vai dar warn no meu aniversário de 28 anos
              period: day
            error_after: 
              count: 12042 #vai dar error no meu aniversário de 29 anos
              period: day
          loaded_at_field: "cast(o_orderdate as timestamp)"
      - name: part
      - name: partsupp
      - name: supplier
      - name: nation
      - name: region
