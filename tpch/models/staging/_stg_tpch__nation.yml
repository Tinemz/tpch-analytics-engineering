version: 2

models:
  - name: stg_tpch__nation
    description: "Países (25 linhas), cada um pertencente a uma região."
    columns:
      - name: nation_id
        description: '{{ doc("tpch_nation_id") }}'
        data_tests:
          - unique
          - not_null
      - name: name
        description: "Nome do país."
        data_tests:
          - not_null
      - name: region_id
        description: '{{ doc("tpch_region_id") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__region')
                field: region_id
      - name: comment
        description: '{{ doc("tpch_comment") }}'