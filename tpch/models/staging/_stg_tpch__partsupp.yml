version: 2

models:
  - name: stg_tpch__partsupp
    description: >
      Oferta de cada peça por cada fornecedor. Grão composto:
      uma linha por (part_id, supplier_id). Nenhuma coluna é única sozinha.
    columns:
      - name: part_id
        description: '{{ doc("tpch_part_id") }} Parte da chave composta deste modelo.'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__part')
                field: part_id
      - name: supplier_id
        description: '{{ doc("tpch_supplier_id") }} Parte da chave composta deste modelo.'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__supplier')
                field: supplier_id
      - name: available_quantity
        description: "Quantidade disponível dessa peça nesse fornecedor."
      - name: supply_cost
        description: "Custo de aquisição da peça junto a esse fornecedor."
      - name: comment
        description: '{{ doc("tpch_comment") }}'