version: 2

models:
  - name: fct_orders
    semantic_model:
      enabled: true
    agg_time_dimension: order_date
    description: >
      Fato de pedidos, um por linha. Receita e quantidades vêm de
      stg_tpch__lineitem agregado por pedido; o cliente liga em dim_customer
      pela entidade customer_id.
    columns:
      - name: order_id
        description: '{{ doc("tpch_order_id") }}'
        entity: primary
        data_tests:
          - unique
          - not_null

      - name: order_id_first_digit
        description: >
          Primeiro dígito do order_id, como texto. Existe só para a regra de
          negócio da métrica `receita`.
        dimension:
          type: categorical
          name: order_id_first_digit

      - name: customer_id
        description: '{{ doc("tpch_customer_id") }}'
        entity: foreign
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id

      - name: order_date
        description: "Data do pedido."
        granularity: day
        dimension:
          type: time
        data_tests:
          - not_null

      - name: order_status
        description: "Status do pedido: F (fulfilled), O (open), P (pending)."
        dimension:
          type: categorical
          name: order_status

      - name: order_priority
        description: "Prioridade do pedido (ex.: 1-URGENT, 5-LOW)."
        dimension:
          type: categorical
          name: order_priority

      - name: total_price
        description: "Valor total do pedido, como vem do cabeçalho (o_totalprice)."

      - name: item_count
        description: "Quantidade de itens (linhas de lineitem) do pedido."

      - name: total_quantity
        description: "Soma das quantidades dos itens."

      - name: gross_revenue
        description: "Receita bruta: soma de extended_price dos itens."

      - name: net_revenue
        description: "Receita líquida: soma de extended_price * (1 - discount) dos itens."

    metrics:
      - name: order_count
        label: Pedidos
        description: "Número de pedidos."
        type: simple
        # sum de 1, não count: o dbt-core reescreve count para sum no parse e o
        # Fusion não, então o MetricFlow recusa o manifest com agg: count.
        agg: sum
        expr: "1"

      - name: customers_with_orders
        label: Clientes com pedido
        description: "Clientes distintos que fizeram pelo menos um pedido no período."
        type: simple
        agg: count_distinct
        expr: customer_id

      - name: gross_revenue
        label: Receita bruta
        description: "Soma de extended_price dos itens, antes do desconto."
        type: simple
        agg: sum
        expr: gross_revenue

      - name: net_revenue
        label: Receita líquida
        description: "Soma de extended_price * (1 - discount) dos itens."
        type: simple
        agg: sum
        expr: net_revenue

      - name: items_sold
        label: Itens vendidos
        description: "Soma das quantidades dos itens."
        type: simple
        agg: sum
        expr: total_quantity

      - name: receita
        label: Receita
        description: >
          Receita oficial da empresa. REGRA DE NEGÓCIO: soma a receita líquida
          (extended_price * (1 - discount)) APENAS dos pedidos cujo order_id
          começa com o dígito 1. Pedidos com qualquer outro primeiro dígito não
          entram. Não é o mesmo número que net_revenue.
        type: simple
        agg: sum
        expr: net_revenue
        filter: |
          {{ Dimension('order_id__order_id_first_digit') }} = '1'

      - name: average_order_value
        label: Ticket médio
        description: "Receita líquida dividida pelo número de pedidos."
        type: ratio
        numerator: net_revenue
        denominator: order_count

      # Métricas complexas: razões por cliente, crescimento e acumulados.

      - name: revenue_per_customer
        label: Receita por cliente
        description: "Receita líquida dividida pelos clientes que fizeram pedido no período."
        type: ratio
        numerator: net_revenue
        denominator: customers_with_orders

      - name: orders_per_customer
        label: Pedidos por cliente
        description: "Pedidos divididos pelos clientes que fizeram pedido no período."
        type: ratio
        numerator: order_count
        denominator: customers_with_orders

      - name: units_per_order
        label: Unidades por pedido
        description: "Itens vendidos (soma das quantidades) divididos pelo número de pedidos."
        type: ratio
        numerator: items_sold
        denominator: order_count

      - name: net_revenue_yoy_growth
        label: Crescimento anual da receita
        description: >
          Variação da receita líquida contra o mesmo período do ano anterior, entre
          -1 e 1 (0,05 = 5%). Exige metric_time na consulta.
        type: derived
        expr: (receita_atual - receita_ano_anterior) / nullif(receita_ano_anterior, 0)
        input_metrics:
          - name: net_revenue
            alias: receita_atual
          - name: net_revenue
            alias: receita_ano_anterior
            offset_window: 1 year

      - name: net_revenue_mom_growth
        label: Crescimento mensal da receita
        description: >
          Variação da receita líquida contra o mês anterior (0,05 = 5%). Exige
          metric_time na consulta, de preferência por mês.
        type: derived
        expr: (receita_atual - receita_mes_anterior) / nullif(receita_mes_anterior, 0)
        input_metrics:
          - name: net_revenue
            alias: receita_atual
          - name: net_revenue
            alias: receita_mes_anterior
            offset_window: 1 month

      - name: net_revenue_ytd
        label: Receita no ano até a data
        description: >
          Receita líquida acumulada desde 1º de janeiro. Por mês, mostra o valor
          acumulado no último dia do mês.
          Consulte sozinha ou com métricas simples: junto de outras acumuladas a
          consulta passa do limite de CPU do BigQuery.
        type: cumulative
        grain_to_date: year
        period_agg: last
        input_metric: net_revenue

      - name: net_revenue_trailing_12m
        label: Receita dos últimos 12 meses
        description: >
          Receita líquida dos 12 meses anteriores a cada data. Tira a sazonalidade.
          Exige metric_time na consulta.
          Consulte sozinha ou com métricas simples: junto de outras acumuladas a
          consulta passa do limite de CPU do BigQuery.
        type: cumulative
        window: 12 months
        period_agg: last
        input_metric: net_revenue

      - name: active_customers_90d
        label: Clientes ativos em 90 dias
        description: >
          Clientes distintos com pelo menos um pedido nos 90 dias anteriores a cada
          data. Exige metric_time na consulta.
          Consulte sozinha ou com métricas simples: junto de outras acumuladas a
          consulta passa do limite de CPU do BigQuery.
        type: cumulative
        window: 90 days
        period_agg: last
        input_metric: customers_with_orders

