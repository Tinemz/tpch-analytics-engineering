version: 2

models:
  - name: int_order_items_enriched
    description: >
      Itens de pedido com custo do fornecedor (partsupp), prazos de entrega e o
      país do cliente e do fornecedor. Os left joins são conferidos pelos testes
      de not_null abaixo: se algum deles perder linha, o teste falha.
    columns:
      - name: order_id
        description: '{{ doc("tpch_order_id") }}'
        data_tests:
          - not_null
      - name: line_number
        description: "Número da linha dentro do pedido."
      - name: part_id
        description: '{{ doc("tpch_part_id") }}'
      - name: supplier_id
        description: '{{ doc("tpch_supplier_id") }}'
      - name: customer_id
        description: '{{ doc("tpch_customer_id") }}'
        data_tests:
          - not_null
      - name: customer_nation_id
        description: "País do cliente."
        data_tests:
          - not_null
      - name: supplier_nation_id
        description: "País do fornecedor."
        data_tests:
          - not_null
      - name: trade_type
        description: "nacional quando cliente e fornecedor são do mesmo país, internacional quando não."
        data_tests:
          - accepted_values:
              arguments:
                values: ["nacional", "internacional"]
      - name: ship_date
        description: "Data de envio do item."
      - name: commit_date
        description: "Data prometida de entrega."
      - name: receipt_date
        description: "Data em que o cliente recebeu."
      - name: delivery_days
        description: "Dias entre o envio e o recebimento."
        data_tests:
          - not_null
      - name: is_late
        description: "Verdadeiro quando o item chegou depois da data prometida."
      - name: ship_mode
        description: "Modal de envio."
      - name: return_flag
        description: "R (devolvido), A (aceito), N (nenhum)."
      - name: line_status
        description: "O (aberto) ou F (finalizado)."
      - name: quantity
        description: "Quantidade do item."
      - name: extended_price
        description: "Preço estendido do item (quantidade x preço unitário)."
      - name: discount
        description: "Desconto aplicado, entre 0 e 0,10."
      - name: supply_cost
        description: "Custo unitário que o fornecedor cobra pela peça (partsupp)."
        data_tests:
          - not_null
      - name: cost_amount
        description: "Custo do item: supply_cost x quantity."
