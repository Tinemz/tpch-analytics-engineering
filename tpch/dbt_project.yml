name: 'tpch'
version: '1.0.0'
config-version: 2

profile: 'tpch'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
vars:
  # Anos somados às datas do TPC-H no staging (macro shift_tpch_date). 28 leva 1992-1998
  # para 2020-2026 mantendo dia da semana e anos bissextos.
  tpch_years_offset: 28

clean-targets:
  - "target"
  - "dbt_packages"

models:
  tpch:
    utils:
      +materialized: table
      +schema: utils
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  tpch:
    +schema: seeds

flags:
  # O dbt-core 1.12 converte o `window` das métricas cumulativas do formato novo
  # para type_params.window e, com esta flag ligada (padrão), recusa o próprio
  # resultado. O manifest sai com o window nos dois lugares e o MetricFlow lê
  # normalmente; desligada, vira só um aviso de depreciação. O Fusion não tem o
  # problema. Rever ao subir a versão do dbt-core.
  require_nested_cumulative_type_params: false
