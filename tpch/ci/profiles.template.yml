# Profile SÓ para CI. É versionado de propósito: NÃO contém segredo nenhum,
# apenas referências env_var() preenchidas em runtime pelo GitHub Actions.
# A credencial real (chave da service-account do GCP) vive no GitHub Secret
# GCP_SA_KEY e é escrita num keyfile pelo próprio workflow antes do dbt rodar.
#
# O workflow copia este arquivo para ~/.dbt/profiles.yml na máquina efêmera.
# O nome do profile ('tpch') tem que bater com `profile:` do dbt_project.yml.
tpch:
  target: ci
  outputs:
    ci:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('DBT_CI_SCHEMA') }}"   # schema isolado por PR, ex: dbt_ci_pr_42
      location: US
      threads: 4
