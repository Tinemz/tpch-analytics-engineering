name: dbt CD (prod)

# GATILHOS:
#   push na main tocando o projeto dbt  -> deploy automático (o "merge deu deploy")
#   workflow_dispatch                    -> botão "Run workflow" pra rodar na mão
on:
  push:
    branches: [main]
    paths:
      - "tpch/**"
      # O workflow observa a si mesmo: sem esta linha, um PR que muda só o
      # pipeline de deploy entra na main sem nunca rodar o deploy — a mudança
      # fica sem validação até alguém, por acaso, tocar em tpch/.
      - ".github/workflows/cd.yml"
      # O servidor MCP sai junto: a imagem carrega as definições de métrica do
      # commit, então toda mudança na camada semântica republica o servidor.
      - "semantic_layer_mcp/**"
      - "Dockerfile"
  workflow_dispatch:

# Deploys de produção NUNCA se cancelam no meio: se dois merges caírem juntos,
# o segundo espera o primeiro terminar em vez de abortá-lo (evita estado parcial).
concurrency:
  group: cd-prod
  cancel-in-progress: false

defaults:
  run:
    working-directory: tpch

env:
  GCP_PROJECT: dbt-learning-tinem
  GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-credentials-cd.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instala Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala o dbt (adapter BigQuery)
        # Mesmas versões do servidor MCP e do venv local (tpch/requirements.txt).
        run: pip install -r requirements.txt

      - name: Escreve o keyfile a partir do secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Monta o profiles.yml
        run: |
          mkdir -p ~/.dbt
          cp deploy/profiles.template.yml ~/.dbt/profiles.yml

      # O deploy: constrói e testa TUDO no dataset de produção (tpch_prod).
      # Diferente da CI, aqui NÃO há schema efêmero nem drop — é persistente.
      - name: dbt build (produção -> tpch_prod)
        run: dbt build --target prod

      # Publica o manifest.json desta build como artifact. É o "retrato" do
      # projeto como ele existe em prod: quais modelos, com que SQL, apontando
      # pra que relations. A CI baixa esse arquivo e usa como --state, e é a
      # comparação contra ele que define o `state:modified` de cada PR.
      #
      # Sem `if: always()` de propósito: só publicamos o manifest de uma build
      # que DEU CERTO. Um manifest de build quebrada descreveria um prod que
      # não existe, e a CI passaria a deferir pra tabelas ausentes.
      - name: Publica o manifest de prod
        uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: tpch/target/manifest.json
          retention-days: 90
          if-no-files-found: error

  # Republica o servidor MCP no Cloud Run com o código e as métricas deste commit.
  # Só depois do dbt build: a imagem nova consulta tabelas que acabaram de ser
  # reconstruídas. Conta de serviço, chave da URL e limites ficam como o
  # infra/mcp/setup_gcp.sh deixou; aqui só troca a imagem.
  deploy-mcp:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autentica no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Instala o gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy no Cloud Run
        run: |
          gcloud run deploy tpch-semantic-layer \
            --source . \
            --project "$GCP_PROJECT" \
            --region us-central1 \
            --quiet

